# How small can it really get? Builds a Lean project for real on GitHub's
# machines, then runs SLOP_DESTROYER graph mode: Lean's own recorded
# dependencies decide what's deletable, and a rebuild (with automatic repair)
# proves the trimmed project still compiles. Finally checks with
# `#print axioms` that the headline theorems are still sorry-free.
name: SLOP_DESTROYER verified trim

on:
  workflow_dispatch:
    inputs:
      repo:
        default: lsernau/grh-lean
      subdir:
        default: grh-compact
  push:
    branches: [claude/optimistic-tesla-pw5s77]
    paths: [".github/workflows/slop-destroyer-verify.yml"]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # = bash -eo pipefail: a failing command in a pipeline fails the step

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      REPO: ${{ inputs.repo || 'lsernau/grh-lean' }}
      SUBDIR: ${{ inputs.subdir || 'grh-compact' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Project info
        working-directory: target/${{ env.SUBDIR }}
        run: |
          echo "commit: $(git rev-parse HEAD)"
          cat lean-toolchain
          ls
          (cat lakefile.toml 2>/dev/null || cat lakefile.lean) | head -40
          find . -name '*.lean' -not -path './.lake/*' -print0 | xargs -0 cat | wc -l | xargs echo "lines before:"
          df -h . | tail -1; nproc; free -g | head -2

      - name: Fetch Mathlib's prebuilt files
        working-directory: target/${{ env.SUBDIR }}
        run: |
          lake --version
          if grep -qi mathlib lake-manifest.json 2>/dev/null; then lake exe cache get; fi

      - name: Baseline build
        working-directory: target/${{ env.SUBDIR }}
        run: |
          start=$(date +%s)
          lake build 2>&1 | tail -20
          echo "baseline build: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Headline theorems and their module
        id: keep
        working-directory: target/${{ env.SUBDIR }}
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
        run: |
          python -m slop_destroyer.find_theorems . RiemannHypothesis --where | tee where.txt
          keep=$(python -m slop_destroyer.find_theorems . RiemannHypothesis --headline | paste -sd, -)
          echo "keep=$keep" >> "$GITHUB_OUTPUT"
          # module of the file holding the real proof = path relative to a srcDir, if its .olean exists
          file=$(grep -oE 'at  [^:]+' where.txt | cut -c5- | while read f; do grep -q sorry "$f" || echo "$f"; done | head -1)
          python - "$file" >> "$GITHUB_OUTPUT" <<'EOF'
          import sys
          from pathlib import Path
          f = Path(sys.argv[1]).with_suffix("")
          parts = f.parts
          for k in range(len(parts)):
              mod = ".".join(parts[k:])
              if Path(".lake/build/lib/lean", *parts[k:]).with_suffix(".olean").exists():
                  print(f"module={mod}")
                  break
          roots = sorted({p.stem if p.is_file() else p.name for p in Path(".lake/build/lib/lean").iterdir()
                          if p.suffix in ("", ".olean")})
          print("prefixes=" + " ".join(roots))
          EOF
          cat "$GITHUB_OUTPUT"

      - name: SLOP_DESTROYER graph mode (write + verify by rebuilding)
        working-directory: target/${{ env.SUBDIR }}
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
        run: |
          args=()
          IFS=',' read -ra names <<< "${{ steps.keep.outputs.keep }}"
          for n in "${names[@]}"; do args+=(--keep "$(echo "$n" | xargs)"); done
          for p in ${{ steps.keep.outputs.prefixes }}; do args+=(--prefix "$p"); done
          start=$(date +%s)
          python -m slop_destroyer graph --root . --module "${{ steps.keep.outputs.module }}" "${args[@]}" \
            --show --write --verify --rounds 4 2>&1 | tee graph.log | grep -v "^trace:" | tail -200
          echo "graph mode: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          lines=$(find . -name '*.lean' -not -path './.lake/*' -print0 | xargs -0 cat | wc -l)
          echo "lines after graph mode: $lines" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint-fix (unused simp arguments, unused haves, dead tactics)
        working-directory: target/${{ env.SUBDIR }}
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
        run: |
          start=$(date +%s)
          python -m slop_destroyer lintfix --root . --write --verify --passes 2 -j 4 2>&1 | tee lintfix.log | tail -40
          echo "lint-fix: $(( $(date +%s) - start ))s; $(grep 'total fixes' lintfix.log)" | tee -a "$GITHUB_STEP_SUMMARY"
          lines=$(find . -name '*.lean' -not -path './.lake/*' -print0 | xargs -0 cat | wc -l)
          echo "lines after lint-fix: $lines" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Graph mode again (lint-fix can make more declarations unused)
        working-directory: target/${{ env.SUBDIR }}
        env:
          PYTHONPATH: ${{ github.workspace }}/tool
        run: |
          args=()
          IFS=',' read -ra names <<< "${{ steps.keep.outputs.keep }}"
          for n in "${names[@]}"; do args+=(--keep "$(echo "$n" | xargs)"); done
          for p in ${{ steps.keep.outputs.prefixes }}; do args+=(--prefix "$p"); done
          python -m slop_destroyer graph --root . --module "${{ steps.keep.outputs.module }}" "${args[@]}" \
            --write --verify --rounds 4 2>&1 | tee graph2.log | grep -v "^trace:" | tail -60
          lines=$(find . -name '*.lean' -not -path './.lake/*' -print0 | xargs -0 cat | wc -l)
          echo "lines after second graph pass: $lines" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the headline theorems
        if: always()
        working-directory: target/${{ env.SUBDIR }}
        run: |
          {
            echo "import ${{ steps.keep.outputs.module }}"
            IFS=',' read -ra names <<< "${{ steps.keep.outputs.keep }}"
            for n in "${names[@]}"; do echo "#print axioms $(echo "$n" | xargs)"; done
          } > SlopAxiomsCheck.lean
          cat SlopAxiomsCheck.lean
          lake env lean SlopAxiomsCheck.lean 2>&1 | tee axioms.txt
          rm SlopAxiomsCheck.lean
          if grep -q sorryAx axioms.txt; then echo "::error::a headline theorem depends on sorry"; exit 1; fi

      - name: Results
        if: always()
        working-directory: target/${{ env.SUBDIR }}
        run: |
          mkdir -p ../../report
          after=$(find . -name '*.lean' -not -path './.lake/*' -print0 | xargs -0 cat | wc -l)
          git diff --shortstat | tee ../../report/diffstat.txt
          git diff | gzip -9 > ../../report/trim.patch.gz
          cp graph.log graph2.log lintfix.log axioms.txt where.txt ../../report/ 2>/dev/null || true
          {
            echo "## $REPO / $SUBDIR"
            echo
            echo "lines after: $after"
            echo
            echo "patch: $(cat ../../report/diffstat.txt)"
            echo
            echo '```'; cat axioms.txt 2>/dev/null; echo '```'
            echo '```'; grep -E "constants in project|lines in touched|\[verify\]|deletable" graph.log 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-trim
          path: report/
          retention-days: 30

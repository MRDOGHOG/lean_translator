# SLOP_DESTROYER static mode (no compiler) on the Lean RH/GRH proofs, run on
# GitHub's machines. One job per version; each keeps every theorem in the
# file that genuinely proves RiemannHypothesis (the "headline" theorems).
# Results: run summary + a "slop-<label>" artifact per version.
name: SLOP_DESTROYER on riemann-hypothesis

on:
  workflow_dispatch:
  push:
    branches: [claude/optimistic-tesla-pw5s77]
    paths: [".github/workflows/slop-destroyer-rh.yml", "slop_destroyer/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # = bash -eo pipefail: a failing command in a pipeline fails the step

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: community-mirror
            repo: leanprover-community/riemann-hypothesis
            subdir: "."
          - label: sernau-readable
            repo: lsernau/grh-lean
            subdir: grh
          - label: sernau-compact
            repo: lsernau/grh-lean
            subdir: grh-compact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate the project
        id: proj
        run: |
          echo "commit: $(git -C target rev-parse HEAD)"
          dir="target/${{ matrix.subdir }}"
          if [ ! -d "$dir" ]; then
            echo "::warning::$dir not found; top level is:"; ls target; dir=target
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          find "$dir" -name '*.lean' -not -path '*/.lake/*' | wc -l | xargs echo ".lean files:"
          find "$dir" -name '*.lean' -not -path '*/.lake/*' -print0 | xargs -0 cat | wc -l | xargs echo "lines:"

      - name: Where is the proof, and the headline theorems
        id: keep
        run: |
          dir="${{ steps.proj.outputs.dir }}"
          python -m slop_destroyer.find_theorems "$dir" RiemannHypothesis --where \
            "https://github.com/${{ matrix.repo }}/blob/$(git -C target rev-parse HEAD)/${{ matrix.subdir }}" | tee where.txt || true
          keep=$(python -m slop_destroyer.find_theorems "$dir" RiemannHypothesis --headline | paste -sd, -) || true
          [ -z "$keep" ] && keep=$(python -m slop_destroyer.find_theorems "$dir" RiemannHypothesis | paste -sd, -)
          echo "headline theorems kept: $keep"
          echo "keep=$keep" >> "$GITHUB_OUTPUT"

      - name: Run SLOP_DESTROYER (static mode)
        run: |
          args=()
          IFS=',' read -ra names <<< "${{ steps.keep.outputs.keep }}"
          for n in "${names[@]}"; do args+=(--keep "$(echo "$n" | xargs)"); done
          mkdir -p report
          python -m slop_destroyer static --root "${{ steps.proj.outputs.dir }}" "${args[@]}" \
            --report report --write --show 15
          cp where.txt report/

      - name: Patch and summary
        if: always()
        run: |
          mkdir -p report
          (cd target && git diff --shortstat | tee ../report/diffstat.txt && git diff | gzip -9 > ../report/slop.patch.gz)
          {
            echo "# ${{ matrix.label }} (\`${{ matrix.repo }}\` / \`${{ matrix.subdir }}\`)"
            echo
            echo "Headline theorems kept: \`${{ steps.keep.outputs.keep }}\`"
            echo
            [ -f report/report.md ] && sed -n '3,20p' report/report.md
            echo
            echo "Patch: $(cat report/diffstat.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slop-${{ matrix.label }}
          path: report/
          retention-days: 30
